<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>页面未找到 — DeepThink</title>
<style>
  :root { --ink: #171411; --paper: #ece4d3; --dim: #a99c85; --gold: #d9a441; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    min-height: 100vh; display: grid; place-items: center;
    background: var(--ink); color: var(--paper);
    font-family: "EB Garamond", "Songti SC", "Noto Serif CJK SC", Georgia, serif;
    padding: 32px; text-align: center;
  }
  main { max-width: 560px; }
  .code {
    font-style: italic; font-size: clamp(72px, 18vw, 132px);
    line-height: 1; color: var(--gold); opacity: .9;
  }
  h1 { font-size: clamp(22px, 4vw, 32px); font-weight: 500; margin-top: 18px; }
  p { color: var(--dim); margin-top: 14px; font-size: 16px; line-height: 1.8; }
  a {
    display: inline-block; margin-top: 32px; color: var(--gold);
    text-decoration: none; padding-bottom: 4px;
    border-bottom: 1px solid rgba(217,164,65,.32);
  }
  a:hover { color: var(--paper); }
</style>
</head>
<body>
<main>
  <div class="code">404</div>
  <h1>这一页没有被推演出来。</h1>
  <p>你访问的地址不存在，或者已经被移走。</p>
  <a href="/">返回 DeepThink 首页 →</a>
</main>
</body>
</html>
