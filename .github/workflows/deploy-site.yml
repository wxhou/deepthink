# 自动部署 deepthink 宣传页到 Cloudflare Pages
#
# 触发:push 到 main,且改动 site/ 或部署配置(也支持手动 dispatch)
# 安全:
#   - 复用 scripts/deploy-site.sh(项目名硬编码 + wxhou 黑名单 + wrangler 版本锁定)
#   - 只在 site/ 或部署相关文件有改动时运行(避免每次 push 都 deploy)
#   - 用 GitHub encrypted secret CLOUDFLARE_API_TOKEN
#
# 用户首次配置:
#   1. Cloudflare Dashboard → My Profile → API Tokens → Create Token
#      → Edit Cloudflare Pages 模板(权限 Pages:Edit)
#      → Account Resources: <your account> → 创建后复制 token
#   2. GitHub repo → Settings → Secrets and variables → Actions
#      → New repository secret:  CLOUDFLARE_API_TOKEN = <token>
#   3. 完成。以后每次改 site/index.html 推 main,自动部署。
#
# 线上 URL: https://deepthinking.pages.dev

name: Deploy site to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "wrangler.toml"
      - "scripts/deploy-site.sh"
      - ".github/workflows/deploy-site.yml"
  workflow_dispatch:

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"   # wrangler 4.x 要求 Node >= 22

      - name: Verify deploy guard
        run: |
          bash ./scripts/deploy-site.sh --dry-run

      - name: Check Cloudflare token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN secret is not set. See the setup steps at the top of this workflow file."
            exit 1
          fi

      - name: Deploy via wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          # 项目名、wrangler 版本、wxhou 黑名单都在脚本里硬编码
          bash ./scripts/deploy-site.sh

      - name: Verify deployment
        run: |
          # 部署后探活,失败不阻塞(用户可手动验证)
          sleep 10
          for i in 1 2 3; do
            if curl -fsSL -o /dev/null -w "%{http_code}\n" https://deepthinking.pages.dev/; then
              echo "✅ Deployment verified"
              exit 0
            fi
            sleep 5
          done
          echo "⚠️ Verification probe failed; deployment may still be propagating"
          exit 0
